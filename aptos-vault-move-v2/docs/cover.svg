<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Aptos Vault Move v2 - Doğrudan Kasa Adresi Mimarisi ve Test Portalı</title>
  <desc id="d">Kapak görseli: solda proje başlığı ve istatistikler, sağda eski (admin üzerinden türetme) ile yeni (doğrudan vault_address) mimariyi karşılaştıran şema.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.5" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrowViolet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1180" cy="70" r="300" fill="url(#glowCyan)"/>
  <circle cx="150" cy="600" r="280" fill="url(#glowViolet)"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="72" y="86" font-size="15" fill="#22d3ee" letter-spacing="4">PATİKA · BACKEND ÖDEVİ</text>
    <text x="72" y="112" font-size="14" fill="#64748b" letter-spacing="1">MOVE 2 / APTOS FRAMEWORK / AKILLI SÖZLEŞME REFAKTÖRÜ</text>
  </g>

  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="72" y="192" font-size="52" font-weight="700" fill="#f8fafc">Aptos Vault</text>
    <text x="72" y="248" font-size="52" font-weight="700" fill="url(#accent)">Move v2</text>
    <text x="72" y="290" font-size="21" fill="#cbd5e1">Doğrudan Kasa Adresi (vault_address) Mimarisi</text>
    <text x="72" y="318" font-size="17" fill="#7c8ba1">SignerCapability artık Vault kaynağının içinde · get_vault_address kaldırıldı</text>
  </g>

  <rect x="72" y="342" width="452" height="1" fill="url(#accent)" opacity="0.5"/>

  <g>
    <g transform="translate(72,368)">
      <rect width="140" height="82" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="70" y="41" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#22d3ee">311</text>
      <text x="70" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">satır vault.move</text>
    </g>
    <g transform="translate(228,368)">
      <rect width="140" height="82" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="70" y="41" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#c4b5fd">6</text>
      <text x="70" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">birim test</text>
    </g>
    <g transform="translate(384,368)">
      <rect width="140" height="82" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="70" y="41" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#fbbf24">7</text>
      <text x="70" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">hata kodu</text>
    </g>
  </g>

  <g font-family="Consolas, monospace" font-size="14" fill="#64748b">
    <text x="72" y="502">Enes Öztürk · 2 Kasım 2026</text>
    <text x="72" y="526">deposit / allocate / claim / withdraw / transfer_admin</text>
  </g>

  <g transform="translate(620,92)">
    <text x="588" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#64748b" letter-spacing="3">MİMARİ FARK</text>
    <text x="0" y="20" text-anchor="start" font-family="Consolas, monospace" font-size="14" fill="#22d3ee">v1 → v2 · storage lookup kaldırıldı</text>

    <rect x="0" y="36" width="588" height="188" rx="16" fill="#0f172a" fill-opacity="0.72" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="24" y="66" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#c4b5fd">ESKİ · admin üzerinden türetme</text>
    <g font-family="Consolas, monospace" font-size="12.5" fill="#cbd5e1">
      <rect x="24" y="92" width="112" height="44" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="80" y="119" text-anchor="middle">admin</text>
      <rect x="188" y="92" width="176" height="44" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="276" y="112" text-anchor="middle" font-size="11">VaultSigner</text>
      <text x="276" y="127" text-anchor="middle" font-size="11">Capability</text>
      <rect x="416" y="92" width="148" height="44" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="490" y="119" text-anchor="middle">Vault</text>
    </g>
    <g stroke="#a78bfa" stroke-width="1.7" fill="none" marker-end="url(#arrowViolet)">
      <path d="M136 114H184"/>
      <path d="M364 114H412"/>
    </g>
    <text x="24" y="172" font-family="Consolas, monospace" font-size="12" fill="#a78bfa">get_vault_address(admin)</text>
    <text x="24" y="192" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#7c8ba1">Her işlemde ek borrow_global okuması · tek admin = tek kasa</text>

    <rect x="0" y="248" width="588" height="216" rx="16" fill="#0f172a" fill-opacity="0.72" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="24" y="278" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#67e8f9">YENİ · doğrudan kasa adresi</text>
    <g font-family="Consolas, monospace" font-size="12.5" fill="#e2e8f0">
      <rect x="24" y="304" width="150" height="44" rx="9" fill="#083344" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="99" y="324" text-anchor="middle" font-size="11">vault_address</text>
      <text x="99" y="339" text-anchor="middle" font-size="11">(parametre)</text>
      <rect x="252" y="304" width="150" height="44" rx="9" fill="#083344" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="327" y="331" text-anchor="middle">Vault + cap</text>
    </g>
    <path d="M174 326H248" stroke="#22d3ee" stroke-width="1.9" fill="none" marker-end="url(#arrowCyan)"/>
    <text x="211" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#22d3ee">O(1)</text>
    <text x="24" y="376" font-family="Consolas, monospace" font-size="12" fill="#67e8f9">assert!(vault.admin == signer::address_of(admin))</text>
    <text x="24" y="398" font-family="Consolas, monospace" font-size="12" fill="#67e8f9">transfer_admin(...) + AdminTransferredEvent</text>
    <text x="24" y="424" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#7c8ba1">Yetki, kasanın güncel admin alanından okunur · mülkiyet devredilebilir</text>
    <text x="24" y="446" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#64748b">1 admin → N kasa (Resource Account başına bağımsız adres)</text>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)" opacity="0.85"/>
</svg>
