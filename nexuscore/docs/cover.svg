<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">NexusCore - AI Quantum Terminal and Threat Visualizer</title>
  <desc id="d">Kapak gorseli: solda proje basi ve tek dosyali arayuzden dogrulanmis sayilar, sagda canvas radar + terml model + CLI zinciri ve verilerin kurgusal oldugunu soyleyen sinir karti.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020205"/>
      <stop offset="0.5" stop-color="#060a18"/>
      <stop offset="1" stop-color="#0d0410"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff0055" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#00f3ff"/>
    </marker>
    <marker id="arrowRose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#ff0055"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1150" cy="90" r="300" fill="url(#glowCyan)"/>
  <circle cx="140" cy="600" r="250" fill="url(#glowRose)"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="72" y="84" font-size="15" fill="#00f3ff" letter-spacing="4">PATIKA · ARAYUZ MUHENDISLIGI CIKISI</text>
    <text x="72" y="110" font-size="14" fill="#64748b" letter-spacing="1">TEK DOSYA HTML5 / CSS3 / ES6+ · HARICI JS KUTUPHANESI YOK</text>
  </g>

  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="72" y="184" font-size="48" font-weight="700" fill="#f8fafc">NexusCore</text>
    <text x="72" y="228" font-size="34" font-weight="700" fill="url(#accent)">Quantum Terminal</text>
    <text x="72" y="266" font-size="19" fill="#cbd5e1">Cyber-glass HUD: canvas radar, terml model, CLI, Web Audio</text>
    <text x="72" y="292" font-size="16" fill="#7c8ba1">Tum tehdit ve model metrikleri SIMULASYONDIR · izleme yapilmaz</text>
  </g>

  <rect x="72" y="312" width="452" height="1" fill="url(#accent)" opacity="0.5"/>

  <g>
    <g transform="translate(72,336)">
      <rect width="104" height="80" rx="12" fill="url(#card)" stroke="#00f3ff" stroke-opacity="0.35"/>
      <text x="52" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#00f3ff">2483</text>
      <text x="52" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">satir · tek dosya</text>
    </g>
    <g transform="translate(188,336)">
      <rect width="104" height="80" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="52" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#38bdf8">11</text>
      <text x="52" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">CLI komutu</text>
    </g>
    <g transform="translate(304,336)">
      <rect width="104" height="80" rx="12" fill="url(#card)" stroke="#a3e635" stroke-opacity="0.32"/>
      <text x="52" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#a3e635">51</text>
      <text x="52" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">id · 0 kirik</text>
    </g>
    <g transform="translate(420,336)">
      <rect width="104" height="80" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="52" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#fbbf24">8</text>
      <text x="52" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">kurgusal dugum</text>
    </g>
  </g>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#64748b">
    <text x="72" y="446">95 468 karakter · 1 inline script · 14 sinaps dugumu · 7 seed paket</text>
    <text x="72" y="468">dist: index.html 43,54 kB + JS 21,38 kB (gzip 11,17 + 8,05)</text>
  </g>

  <rect x="72" y="492" width="452" height="104" rx="12" fill="#0f172a" stroke="#ff0055" stroke-opacity="0.45"/>
  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="92" y="520" font-size="14" font-weight="700" fill="#ff5c8a">GERCEK / KURGU</text>
    <text x="92" y="546" font-size="13" fill="#cbd5e1">Gercek: Canvas 2D cizimi, Web Audio osilatorleri, UTC saat,</text>
    <text x="92" y="566" font-size="13" fill="#cbd5e1">oturum suresi, komut gecmisi, DOM .html disa aktarimi.</text>
    <text x="92" y="586" font-size="13" fill="#cbd5e1">Kurgu: dugum/IP listesi, tok/s, GHz termali, DEFCON durumu.</text>
  </g>

  <g>
    <text x="600" y="120" font-family="Consolas, monospace" font-size="14" fill="#94a3b8" letter-spacing="2">VERI KAYNAGI → ARAYUZ ETIKETI</text>

    <rect x="600" y="140" width="212" height="72" rx="12" fill="url(#card)" stroke="#00f3ff" stroke-opacity="0.5"/>
    <text x="706" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#e2e8f0">radarNodes[8]</text>
    <text x="706" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">sabit ornek → filtre sayisi</text>

    <rect x="860" y="140" width="212" height="72" rx="12" fill="url(#card)" stroke="#a3e635" stroke-opacity="0.5"/>
    <text x="966" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0">TUM DUGUMLER (8)</text>
    <text x="966" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#bef264">IHLAL 1 · DDoS 2 · KUANTUM 1</text>

    <path d="M812 176H852" stroke="#00f3ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="600" y="266" width="212" height="72" rx="12" fill="url(#card)" stroke="#b000ff" stroke-opacity="0.55"/>
    <text x="706" y="296" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0">kaydirici → terml model</text>
    <text x="706" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#d8b4fe">formul cikisi: °C, W, V, RPM</text>

    <rect x="860" y="266" width="212" height="72" rx="12" fill="url(#card)" stroke="#b000ff" stroke-opacity="0.55"/>
    <text x="966" y="296" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0">donanim okunmaz</text>
    <text x="966" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#d8b4fe">MODEL GIRDISI + tooltip</text>

    <path d="M812 302H852" stroke="#b000ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="600" y="392" width="212" height="72" rx="12" fill="url(#card)" stroke="#ff0055" stroke-opacity="0.55"/>
    <text x="706" y="422" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0">kullanici girdisi</text>
    <text x="706" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fda4af">innerHTML → textContent (XSS)</text>

    <rect x="860" y="392" width="212" height="72" rx="12" fill="url(#card)" stroke="#ff0055" stroke-opacity="0.55"/>
    <text x="966" y="422" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0">&lt;img onerror&gt; → 0 etiket</text>
    <text x="966" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fda4af">tarayicida dogrulandi</text>

    <path d="M812 428H852" stroke="#ff0055" stroke-width="2" marker-end="url(#arrowRose)"/>

    <rect x="600" y="518" width="472" height="58" rx="12" fill="#0f172a" stroke="#00f3ff" stroke-opacity="0.35"/>
    <text x="836" y="543" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">tools/check_inline_html.mjs index.html</text>
    <text x="836" y="563" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">sozdizimi 0 · eksik id 0 · cinifti id 0 → SONUC: BASARILI</text>

    <g font-family="Consolas, monospace" font-size="12" fill="#475569">
      <text x="1100" y="180">3 yazi tipi</text>
      <text x="1100" y="202">4 tehdit kaydi</text>
      <text x="1100" y="224">0 fetch/WS</text>
      <text x="1100" y="246">0 kirik id</text>
    </g>
  </g>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#475569">
    <text x="72" y="620">Enes Ozturk · patika-backend-odevleri/nexuscore</text>
    <text x="1208" y="620" text-anchor="end">sunucuya veri gitmez · tek dis kaynak Google Fonts</text>
  </g>
</svg>
